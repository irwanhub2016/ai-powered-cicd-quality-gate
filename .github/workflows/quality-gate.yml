name: CI Quality Gate [Dockerized] (AI-Generated API & E2E Tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Run Dockerized Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:jammy
      options: --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.21 in Container
        run: |
          apt-get update && apt-get install -y curl ca-certificates
          curl -fsSL https://go.dev/dl/go1.21.8.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Install Application & Playwright Dependencies
        run: |
          npm install
          cd application_code && npm install
          cd ../playwright_template && npm install
          npx playwright install chromium ffmpeg

      - name: Test API Generation Guardrails
        run: node --test scripts/test_guardrails.test.mjs scripts/generation_cache.test.mjs

      - name: Restore Generated Test Cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/generated-tests/
            generated_test/api/generated-api.spec.ts
            generated_test/web/generated-web.spec.ts
            playwright_template/tests/api/generated-api.spec.ts
            playwright_template/tests/web/generated-web.spec.ts
          key: generated-tests-${{ runner.os }}-${{ hashFiles('application_code/docs/swagger.json', 'application_code/app/page.tsx', 'playwright_template/package-lock.json', 'scripts/prompts/api-prompt.txt', 'scripts/prompts/web-prompt.txt', 'scripts/generate_tests.mjs', 'scripts/generation_cache.mjs', 'scripts/test_guardrails.mjs') }}

      - name: Generate API and E2E Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate_tests.mjs

      - name: Start Services & Execute Quality Gate (All inside Docker)
        env:
          CI: '1'
          STAGING_API_URL: http://127.0.0.1:8080
          STAGING_BASE_URL: http://127.0.0.1:3000
        run: |
          export PATH="/usr/local/go/bin:$PATH"

          # 1. Start Go Backend on :8080
          (cd application_code && go run main.go) &

          # 2. Build and start Next.js Frontend on :3000
          (cd application_code && npm run build && npm run start) &

          # 3. Wait for services to be ready
          echo "Waiting for Go backend (:8080) and Next.js frontend (:3000)..."
          timeout 60 bash -c 'until curl -s http://127.0.0.1:8080/api/health; do sleep 1; done'
          timeout 60 bash -c 'until curl -s http://127.0.0.1:3000; do sleep 1; done'
          echo "Both services are live inside Docker!"

          # 4. Execute Quality Gate Tests (API & Web)
          npm --prefix playwright_template test -- --workers=2

      - name: Upload Test Report & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-docker-test-artifacts
          path: |
            playwright_template/playwright-report/
            playwright_template/test-results/
          retention-days: 14
