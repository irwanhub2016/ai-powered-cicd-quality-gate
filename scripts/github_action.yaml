name: CI Quality Gate [Dockerized] (AI-Generated API & E2E Tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Run Dockerized Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.40.0-jammy
      options: --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        run: |
          apt-get update && apt-get install -y curl ca-certificates
          curl -fsSL https://go.dev/dl/go1.21.8.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Install Application Dependencies
        run: |
          npm install
          cd application_code && npm install
          cd ../playwright_template && npm install
          # Pre-baked Playwright browsers (Chromium, Firefox, WebKit, ffmpeg) are already in container!

      - name: Start Backend & Frontend Services in Background
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          
          # Start Go Backend on :8080
          cd application_code
          go run main.go &
          
          # Build and start Next.js Frontend on :3000
          npm run build
          npm run start &
          
          # Wait for services to respond
          echo "Waiting for Go backend (:8080) and Next.js frontend (:3000)..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/health; do sleep 1; done'
          timeout 60 bash -c 'until curl -s http://localhost:3000; do sleep 1; done'
          echo "Services are ready!"

      - name: Programmatic LLM Test Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate_tests.mjs

      - name: Execute Quality Gate Tests (API & Web)
        env:
          CI: '1'
          STAGING_API_URL: http://localhost:8080
          STAGING_BASE_URL: http://localhost:3000
        run: |
          npm test

      - name: Upload Test Report & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-docker-test-artifacts
          path: |
            playwright_template/playwright-report/
            playwright_template/test-results/
          retention-days: 14
