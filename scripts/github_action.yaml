name: CI Quality Gate (AI-Generated API & E2E Tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Run AI Test Generation & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Application & Playwright Dependencies
        run: |
          npm install
          cd application_code && npm install
          cd ../playwright_template && npm install
          npx playwright install --with-deps chromium ffmpeg

      - name: Start Backend & Frontend Services in Background
        run: |
          # Start Go Backend
          cd application_code
          go run main.go &
          
          # Start Next.js Frontend
          npm run build
          npm run start &
          
          # Wait for services to respond
          echo "Waiting for backend (:8080) and frontend (:3000)..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/health; do sleep 1; done'
          timeout 60 bash -c 'until curl -s http://localhost:3000; do sleep 1; done'
          echo "Services are ready!"

      - name: Programmatic LLM Test Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate_tests.mjs

      - name: Execute Quality Gate Tests (API & Web)
        env:
          CI: '1'
          STAGING_API_URL: http://localhost:8080
          STAGING_BASE_URL: http://localhost:3000
        run: |
          npm test

      - name: Upload Test Report & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright_template/playwright-report/
            playwright_template/test-results/
          retention-days: 14
